title = "PropertyStack Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for safe paths and test mocks"
paths = [
  '''(?i)tests/.*''',
  '''(?i).*_test\.go''',
  '''(?i).*_test\.dart''',
  '''(?i).*\.test\.ts''',
  '''(?i).*\.spec\.ts''',
  '''(?i)pnpm-lock\.yaml''',
  '''(?i)package-lock\.json''',
  '''(?i)pubspec\.lock''',
  '''(?i)\.agent/.*''',
  '''(?i)\.agents/.*''',
  '''(?i)\.gemini/.*''',
  '''(?i)\.env\.example$''',
  '''(?i)\.env\.test\.example$''',
  '''(?i)mock-data/.*''',
]
regexes = [
  '''token-tenant-auth''',
  '''token-other-tenant-auth''',
  '''token-manager-auth''',
  '''mock-[a-zA-Z0-9_-]+''',
  '''fake-[a-zA-Z0-9_-]+''',
  '''example-[a-zA-Z0-9_-]+''',
]

# Custom rule for Paystack secret keys
[[rules]]
id = "paystack-secret-key"
description = "Paystack live or test secret key detected"
regex = '''(?i)(?:paystack|ps)_(?:secret|key|live|test)[a-z0-9_]*\s*[:=]\s*["'](sk_(?:live|test)_[a-zA-Z0-9]{32,})["']'''
secretGroup = 1
keywords = ["sk_live_", "sk_test_"]

# Custom rule for Supabase Service Role Key
[[rules]]
id = "supabase-service-role-key"
description = "Supabase service role administrative secret key detected"
regex = '''(?i)(?:supabase.*service.*role.*key|supabase.*secret)\s*[:=]\s*["']([a-zA-Z0-9_\-]{80,})["']'''
secretGroup = 1
keywords = ["service_role"]

# Remita payment gateway secret
[[rules]]
id = "remita-secret-key"
description = "Remita API secret key detected"
regex = '''(?i)REMITA_(?:SECRET|API)_KEY\s*=\s*["']?([A-Za-z0-9+/=_-]{20,})["']?'''
secretGroup = 1
keywords = ["REMITA_SECRET", "REMITA_API_KEY"]

# Resend transactional email API key
[[rules]]
id = "resend-api-key"
description = "Resend API key detected"
regex = '''(?i)RESEND_API_KEY\s*=\s*["']?(re_[A-Za-z0-9_-]{20,})["']?'''
secretGroup = 1
keywords = ["re_"]

# Brevo / Sendinblue API key
[[rules]]
id = "brevo-api-key"
description = "Brevo/Sendinblue API key detected"
regex = '''(?i)BREVO_API_KEY\s*=\s*["']?(xkeysib-[A-Za-z0-9_-]{20,})["']?'''
secretGroup = 1
keywords = ["xkeysib-"]

# Database connection string with embedded credentials
[[rules]]
id = "database-connection-string"
description = "Database connection string with embedded credentials"
regex = '''(?i)DATABASE_URL\s*=\s*["']?((?:postgres|mysql|mongodb)(?:ql)?://[^:]+:[^@]+@[^\s"']+)["']?'''
secretGroup = 1
keywords = ["DATABASE_URL"]

# JWT / session secret
[[rules]]
id = "jwt-secret"
description = "JWT or session secret detected"
regex = '''(?i)JWT_SECRET\s*=\s*["']?([A-Za-z0-9+/=_-]{32,})["']?'''
secretGroup = 1
keywords = ["JWT_SECRET"]


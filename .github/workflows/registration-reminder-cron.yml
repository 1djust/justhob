name: Automated Registration Follow-up Reminders

on:
  schedule:
    # Runs daily at 03:00 AM WAT (02:00 AM UTC)
    - cron: '0 2 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in DRY-RUN mode (simulate without sending emails)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-registration-reminders:
    name: Run Registration Follow-up Email Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: |
          cd property-management-saas
          pnpm install --frozen-lockfile

      - name: Generate Prisma Database Client
        run: |
          cd property-management-saas
          pnpm --filter @property-stack/database db:generate

      - name: Execute Registration Follow-up Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://justhob.vercel.app' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'propertystackapp@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'propertystackapp@gmail.com' }}
        run: |
          cd property-management-saas/apps/api
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx tsx src/scripts/run-registration-reminder.ts --dry-run
          else
            npx tsx src/scripts/run-registration-reminder.ts
          fi

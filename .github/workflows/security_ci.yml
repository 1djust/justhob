name: Security Audit & Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: |
          cd property-management-saas
          pnpm install --frozen-lockfile

      - name: Enforce Dependency Vulnerability Audit
        run: |
          cd property-management-saas
          pnpm audit --prod || npm audit --omit=dev --audit-level=critical || true

      - name: Run Semgrep SAST Code Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

      - name: Run Backend Security & Regression Tests
        run: |
          cd property-management-saas
          pnpm --filter api test

  mobile-tests:
    name: Flutter Mobile Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Mobile Dependencies
        run: |
          cd propertystack_mobile
          flutter pub get

      - name: Run Dart Analyzer
        run: |
          cd propertystack_mobile
          flutter analyze

      - name: Run Mobile Test Suite
        run: |
          cd propertystack_mobile
          flutter test

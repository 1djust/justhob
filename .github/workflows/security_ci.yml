name: Security Audit & Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Run Node Dependency Vulnerability Audit
        run: |
          cd property-management-saas
          pnpm audit --prod || true

      - name: Run Semgrep SAST Code Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  mobile-tests:
    name: Flutter Mobile Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Mobile Dependencies
        run: |
          cd propertystack_mobile
          flutter pub get

      - name: Run Dart Analyzer
        run: |
          cd propertystack_mobile
          flutter analyze

      - name: Run Mobile Test Suite
        run: |
          cd propertystack_mobile
          flutter test

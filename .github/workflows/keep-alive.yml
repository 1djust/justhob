name: Render Backend Keep-Alive

on:
  # Keep-alive pings are handled externally by cron-job.org (GitHub cron is too delayed).
  # Run manually from the Actions tab to wake the backend on demand.
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      HEALTH_URL: https://propertystack.onrender.com/health

    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging $HEALTH_URL at $(date -u)"
          for ATTEMPT in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 90 "$HEALTH_URL") || STATUS="000"
            echo "Attempt $ATTEMPT: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is alive and healthy!"
              exit 0
            fi
            echo "::warning ::Backend not ready (HTTP $STATUS), likely cold-starting. Retrying in 15s..."
            sleep 15
          done
          echo "::error ::Failed to wake backend after 4 attempts, last status: $STATUS"
          exit 1

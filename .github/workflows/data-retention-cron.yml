name: Automated Daily Data Retention & Audit Report

on:
  schedule:
    # Runs every day at 02:00 AM WAT (01:00 AM UTC)
    - cron: '0 1 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  run-retention-job:
    name: Run Data Retention & Audit Cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: |
          cd property-management-saas
          pnpm install --frozen-lockfile

      - name: Generate Prisma Database Client
        run: |
          cd property-management-saas
          pnpm --filter @property-stack/database db:generate

      - name: Execute Data Retention & Email Dispatch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'ogunduyijustus@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'ogunduyijustus@gmail.com' }}
          DATA_RETENTION_WEBHOOK_DAYS: '30'
          DATA_RETENTION_ERROR_LOG_DAYS: '90'
          DATA_RETENTION_SECURITY_LOG_DAYS: '180'
        run: |
          cd property-management-saas/apps/api
          npx tsx src/scripts/run-data-retention-job.ts
